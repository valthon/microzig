name: "Ports"
on:
  push:
    branches: [main, zig-master]
  pull_request:
    branches: [main, zig-master]
  workflow_dispatch:

env:
  # Share a single local cache between all zig build steps so it doesn't build regz multiple times
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_PKG_DIR: ${{ github.workspace }}/zig-pkg

jobs:
  changes:
    name: Select changed inputs
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.paths.outputs.ports }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select jobs
        id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Main pushes and manual runs exercise everything; unknown diffs do too.
          all=false
          if [[ "$EVENT" == workflow_dispatch || ( "$EVENT" == push && "$REF" == refs/heads/main ) ]]; then
            all=true
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            all=true
          else
            if [[ "$EVENT" == pull_request ]]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || all=true
            fi
            if ! git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
              all=true
            fi
          fi
          ports=$all
          if [[ "$all" == false ]]; then
            while IFS= read -r -d '' path; do
              case "$path" in
                # Manifests anywhere and shared build inputs can affect every job.
                core/*|build.zig|build.zig.zon|*/build.zig.zon|build-internals/*|modules/*|.tool-versions|.gitattributes|.github/workflows/*)
                  ports=true
                  ;;
              esac
              case "$path" in
                port/*|examples/*|drivers/*|tools/*) ports=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          {
            echo "ports=$ports"
          } >> "$GITHUB_OUTPUT"

  unit-test:
    needs: changes
    if: needs.changes.outputs.ports == 'true'
    name: "Unit Test"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Zig
      uses: mlugg/setup-zig@v2

    - name: espressif/esp
      run: zig build test
      working-directory: port/espressif/esp

    - name: examples/espressif/esp
      run: zig build test
      working-directory: examples/espressif/esp

    - name: gigadevice/gd32
      run: zig build test
      working-directory: port/gigadevice/gd32

    - name: microchip/atmega
      run: zig build test
      working-directory: port/microchip/atmega

    - name: microchip/attiny
      run: zig build test
      working-directory: port/microchip/attiny

    - name: microchip/samd51
      run: zig build test
      working-directory: port/microchip/samd51

    - name: nordic/nrf5x
      run: zig build test
      working-directory: port/nordic/nrf5x

    - name: nxp/lpc
      run: zig build test
      working-directory: port/nxp/lpc

    - name: nxp/mcx
      run: zig build test
      working-directory: port/nxp/mcx

    - name: raspberrypi/rp2xxx
      run: zig build test
      working-directory: port/raspberrypi/rp2xxx

    - name: stmicro/stm32
      run: zig build test
      working-directory: port/stmicro/stm32

    - name: texasinstruments/msp430
      run: zig build test
      working-directory: port/texasinstruments/msp430

    - name: texasinstruments/mspm0
      run: zig build test
      working-directory: port/texasinstruments/mspm0

    - name: texasinstruments/tm4c
      run: zig build test
      working-directory: port/texasinstruments/tm4c

    - name: wch/ch32v
      run: zig build test
      working-directory: port/wch/ch32v

    - name: wch/ch32h
      run: zig build test
      working-directory: port/wch/ch32h

  build:
    needs: changes
    if: needs.changes.outputs.ports == 'true'
    name: "Build"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Zig
      uses: mlugg/setup-zig@v2

    - name: espressif/esp
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/espressif/esp

    - name: gigadevice/gd32
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/gigadevice/gd32

    - name: microchip/atmega
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/microchip/atmega

    - name: microchip/attiny
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/microchip/attiny

    - name: microchip/samd51
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/microchip/samd51

    - name: nordic/nrf5x
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/nordic/nrf5x

    - name: nxp/lpc
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/nxp/lpc

    - name: nxp/mcx
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/nxp/mcx

    - name: raspberrypi/rp2xxx
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/raspberrypi/rp2xxx

    - name: stmicro/stm32
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/stmicro/stm32

    - name: texasinstruments/msp430
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/texasinstruments/msp430

    - name: texasinstruments/mspm0
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/texasinstruments/mspm0

    - name: texasinstruments/tm4c
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/texasinstruments/tm4c

    - name: wch/ch32v
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/wch/ch32v

    - name: wch/ch32h
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/wch/ch32h

    - name: no_hal/stm32_l031
      run: zig build -Doptimize=ReleaseSmall
      working-directory: examples/no_hal/stm32_l031

