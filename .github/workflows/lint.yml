name: Lint

# Lints the .zig files a PR changes.
#
# Runs on `pull_request` (not `pull_request_target`): the token is read-only
# and no secrets are exposed, so building and running tools from the PR tree
# is safe even for PRs from forks. Results are reported as annotations on the
# PR's "Files changed" tab; no PR comments, so no write permission.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Unused imports are bug-class (NO_SLOP.md §5): this job FAILS the PR.
  unused-imports:
    name: Unused imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List changed Zig files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff -z --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- '*.zig' > "$RUNNER_TEMP/changed.z"
          tr '\0' '\n' < "$RUNNER_TEMP/changed.z"

          if [ -s "$RUNNER_TEMP/changed.z" ]; then
            echo "zig=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Zig
        if: steps.changed.outputs.zig == 'true'
        uses: mlugg/setup-zig@v2

      - name: Build zigimports (pinned)
        if: steps.changed.outputs.zig == 'true'
        env:
          ZIGIMPORTS_SHA: 2fcea024ff380a2b3a0d18ecc22f1068ef2056be
        run: |
          mkdir -p "$RUNNER_TEMP/zigimports"
          cd "$RUNNER_TEMP/zigimports"
          git init -q
          git fetch -q --depth 1 https://github.com/mattnite/zigimports.git "$ZIGIMPORTS_SHA"
          git checkout -q FETCH_HEAD
          zig build --release=safe
          ln -s "$PWD"/zig-out/bin/zigimports-* "$RUNNER_TEMP/zigimports-bin"

      - name: Check for unused imports
        if: steps.changed.outputs.zig == 'true'
        run: |
          if [ ! -s "$RUNNER_TEMP/changed.z" ]; then
            echo "No changed .zig files."
            exit 0
          fi
          set +e
          xargs -0 "$RUNNER_TEMP/zigimports-bin" < "$RUNNER_TEMP/changed.z" > "$RUNNER_TEMP/unused.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/unused.txt"
          # "<file>:<line>:<col>: <name> is unused" -> error annotation
          sed -nE 's/^(.+):([0-9]+):[0-9]+: (.+ is unused)$/::error file=\1,line=\2::\3 (fix: zigimports --fix <file>)/p' "$RUNNER_TEMP/unused.txt"
          exit $rc

  # MicroZig's own naming linter. Naming is style-class (NO_SLOP.md §5), and
  # it has known false positives (C-ABI exports such as `vTaskDelay`), so this
  # job only WARNS and never fails the PR.
  naming:
    name: Naming suggestions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List changed Zig files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff -z --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- '*.zig' > "$RUNNER_TEMP/changed.z"
          tr '\0' '\n' < "$RUNNER_TEMP/changed.z"

          if [ -s "$RUNNER_TEMP/changed.z" ]; then
            echo "zig=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Zig
        if: steps.changed.outputs.zig == 'true'
        uses: mlugg/setup-zig@v2

      - name: Build linter
        if: steps.changed.outputs.zig == 'true'
        working-directory: tools/linter
        run: zig build --release=safe

      - name: Run linter on changed Zig files
        if: steps.changed.outputs.zig == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff -z --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- '*.zig' > "$RUNNER_TEMP/changed.z"
          if [ ! -s "$RUNNER_TEMP/changed.z" ]; then
            echo "No changed .zig files."
            exit 0
          fi
          xargs -0 tools/linter/zig-out/bin/linter < "$RUNNER_TEMP/changed.z" > "$RUNNER_TEMP/lint.json"
          jq -r '.[] | "::warning file=\(.file),line=\(.line)::\(.message)"' "$RUNNER_TEMP/lint.json"

  # Design docs (docs/design/) name the code they describe on a `Covers:` line.
  # This job lists, in the job summary, the docs whose covered code the PR
  # touches, so a reviewer knows where to look. The listing never annotates or
  # fails; the job fails only if the listing's own scenario test does.
  design-docs:
    name: Design docs touched
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List design docs that describe changed code
        run: |
          scripts/design_docs/test_touched_docs.sh
          # The checkout is the PR's merge commit: its first parent is the base branch, and its
          # docs are the ones that will be on main.
          python3 scripts/design_docs/touched_docs.py "$(git rev-parse HEAD^1)" "$(git rev-parse HEAD)" \
            >> "$GITHUB_STEP_SUMMARY"
