name: CI
on:
  push:
    branches: [main, zig-master]
  pull_request:
    branches: [main, zig-master]
  workflow_dispatch:

jobs:
  changes:
    name: Select changed inputs
    runs-on: ubuntu-latest
    outputs:
      regz: ${{ steps.paths.outputs.regz }}
      uf2: ${{ steps.paths.outputs.uf2 }}
      esp_image: ${{ steps.paths.outputs.esp_image }}
      printer: ${{ steps.paths.outputs.printer }}
      stm32: ${{ steps.paths.outputs.stm32 }}
      build: ${{ steps.paths.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select jobs
        id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Main pushes and manual runs exercise everything; unknown diffs do too.
          all=false
          if [[ "$EVENT" == workflow_dispatch || ( "$EVENT" == push && "$REF" == refs/heads/main ) ]]; then
            all=true
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            all=true
          else
            if [[ "$EVENT" == pull_request ]]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || all=true
            fi
            if ! git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
              all=true
            fi
          fi
          regz=$all
          uf2=$all
          esp_image=$all
          printer=$all
          stm32=$all
          build=$all
          if [[ "$all" == false ]]; then
            while IFS= read -r -d '' path; do
              case "$path" in
                # Manifests anywhere and shared build inputs can affect every job.
                core/*|build.zig|build.zig.zon|*/build.zig.zon|build-internals/*|modules/*|.tool-versions|.gitattributes|.github/workflows/*)
                  regz=true
                  uf2=true
                  esp_image=true
                  printer=true
                  stm32=true
                  build=true
                  ;;
              esac
              case "$path" in
                tools/regz/*|tools/flags/*) regz=true ;;
              esac
              case "$path" in
                tools/uf2/*|tools/flags/*) uf2=true ;;
              esac
              case "$path" in
                tools/esp-image/*|tools/flags/*) esp_image=true ;;
              esac
              # Printer also builds the RP2xxx serial runner.
              case "$path" in
                tools/printer/*|tools/flags/*|port/raspberrypi/rp2xxx/*|drivers/*) printer=true ;;
              esac
              case "$path" in
                port/stmicro/stm32/*|tools/regz/*|tools/flags/*) stm32=true ;;
              esac
              case "$path" in
                tools/*) build=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          {
            echo "regz=$regz"
            echo "uf2=$uf2"
            echo "esp_image=$esp_image"
            echo "printer=$printer"
            echo "stm32=$stm32"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  formatting-check:
    name: Formatting check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Run zig fmt
        run: zig fmt --check .

  unit-test-regz:
    needs: changes
    if: needs.changes.outputs.regz == 'true'
    name: Unit Test Regz
    continue-on-error: true
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Unit Test Regz
        run: zig build test
        working-directory: tools/regz

  unit-test-uf2:
    needs: changes
    if: needs.changes.outputs.uf2 == 'true'
    name: Unit Test UF2
    continue-on-error: true
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Unit Test UF2
        run: zig build test
        working-directory: tools/uf2

  unit-test-esp-image:
    needs: changes
    if: needs.changes.outputs.esp_image == 'true'
    name: Unit Test ESP Image
    continue-on-error: true
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Unit Test ESP Image
        run: zig build test
        working-directory: tools/esp-image

  test-printer:
    needs: changes
    if: needs.changes.outputs.printer == 'true'
    name: Test Printer
    continue-on-error: true
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Build Printer
        run: zig build
        working-directory: tools/printer

  stm32-gen-check:
    needs: changes
    if: needs.changes.outputs.stm32 == 'true'
    name: Check that stm32 generated code is up to date
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Generate Code
        run: zig build -Dgenerate
        working-directory: port/stmicro/stm32
      - name: Check for code diffs
        run: |
          if git status --porcelain | grep -v '^??' > /dev/null; then
            echo "Code differences detected:"
            git diff
            echo "Please commit or fix these changes to proceed."
            exit 1
          else
            echo "No code differences detected."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Build
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Build
        run: zig build -Doptimize=ReleaseSmall
