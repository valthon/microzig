name: sim/aviron
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Select changed inputs
    runs-on: ubuntu-latest
    outputs:
      aviron: ${{ steps.paths.outputs.aviron }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select jobs
        id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Main pushes and manual runs exercise everything; unknown diffs do too.
          all=false
          if [[ "$EVENT" == workflow_dispatch || ( "$EVENT" == push && "$REF" == refs/heads/main ) ]]; then
            all=true
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            all=true
          else
            if [[ "$EVENT" == pull_request ]]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || all=true
            fi
            if ! git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
              all=true
            fi
          fi
          aviron=$all
          if [[ "$all" == false ]]; then
            while IFS= read -r -d '' path; do
              case "$path" in
                # Manifests anywhere and shared build inputs can affect every job.
                core/*|build.zig|build.zig.zon|*/build.zig.zon|build-internals/*|modules/*|.tool-versions|.gitattributes|.github/workflows/*)
                  aviron=true
                  ;;
              esac
              case "$path" in
                sim/aviron/*|tools/flags/*) aviron=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          {
            echo "aviron=$aviron"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.aviron == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Build
        working-directory: sim/aviron
        run: zig build install

      - name: Run Test Suite
        working-directory: sim/aviron
        run: zig build test

      - name: Run Samples
        working-directory: sim/aviron
        run: |
          ./zig-out/bin/aviron --info
          ./zig-out/bin/aviron --trace zig-out/samples/math.elf
          ./zig-out/bin/aviron zig-out/samples/hello-world.elf
